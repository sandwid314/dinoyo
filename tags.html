---
layout: page
title: Tags
permalink: /tags/
---

<nav aria-label="Tags">
  <p>
    {% for tag in site.tags %}
      <a href="#{{ tag[0] | slugify }}">{{ tag[0] | escape }}</a>{% unless forloop.last %}, {% endunless %}
    {% endfor %}
  </p>
</nav>

{% for tag in site.tags %}
  <section id="{{ tag[0] | slugify }}">
    <h2>{{ tag[0] | escape }}</h2>

    <ul>
      {% for post in tag[1] %}
        <li>
          <a href="{{ post.url | relative_url }}">
            {{ post.title | escape }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endfor %}
