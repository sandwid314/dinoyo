backend:
  name: turbo-github
  turbo_site_id: 2dfa594e-b2fc-407e-bbc4-6b346e39785e
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Postingan"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "post"

      - label: "Judul"
        name: "title"
        widget: "string"

      - label: "Tanggal"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        picker_utc: false

      - label: "Category"
        name: "categories"
        widget: "select"
        required: false
        options:
          - "Algebra"
          - "Trigonometry"
          - "Geometry"
          - "Calculus"

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false

      - label: "Isi"
        name: "body"
        widget: "markdown"
